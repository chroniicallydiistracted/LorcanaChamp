[project]
name = "lorcana-core-bot"
version = "0.1.0"
description = "Rules-valid Disney Lorcana Core Constructed bot engine scaffold with baseline agents and tests."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["lorcana_bot*"]
exclude = ["data*", "docs*", "tests*", "scripts*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
